name: english_fluency
description: "Cross-platform English Speaking & Communication Practice Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^7.7.0

  # Routing & Navigation
  go_router: ^14.2.0

  # Networking & Serialization
  dio: ^5.5.0+1
  json_annotation: ^4.9.0

  # Audio Capture & Playback
  record: ^5.1.2
  just_audio: ^0.9.38
  audio_waveforms: ^1.0.5

  # Storage & Security
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Permissions & System
  permission_handler: ^11.3.1

  # UI & Animations
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  flutter_spinkit: ^5.2.1
  percent_indicator: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

